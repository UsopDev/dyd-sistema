services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dyd_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend:
    build: .
    env_file:
      - .env.docker
    ports:
      - "3000:3000"
    command: ["./command.sh"]
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
       - postgres
       - redis

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
